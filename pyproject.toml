[project]
name = "clew"
version = "0.13.2"
description = "Fully local meeting transcription and summarization CLI"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0 AND MIT" }
authors = [
    { name = "Pascal Berrang", email = "git@p4l.dev" }
]
maintainers = [
    { name = "Yanis Naamane", email = "yanis@nymedia.io" }
]
requires-python = ">=3.12,<3.14"
keywords = ["meeting", "transcription", "summarization", "whisper", "local", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "click>=8.1",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "whisperx>=3.8",
    "pyannote-audio>=4.0",
    # torchaudio 2.9 removed list_audio_backends(), which pyannote-audio still
    # calls; drop this cap and the <3.14 python cap once fixed upstream
    # (pyannote/pyannote-audio#1974).
    "torchaudio>=2.8,<2.9",
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
openai = ["openai>=1.0"]
all = ["ollama>=0.4", "openai>=1.0"]

[project.urls]
Homepage = "https://github.com/ynaamane/clew"
Repository = "https://github.com/ynaamane/clew"
Issues = "https://github.com/ynaamane/clew/issues"

[project.scripts]
clew = "clew.cli:main"

[dependency-groups]
dev = [
    "ollama>=0.4",
    "openai>=1.0",
    "pytest>=8.0",
    "pytest-httpserver>=1.1",
    "ruff>=0.9",
    "jiwer>=4.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "macos: tests that require macOS",
    "hardware: tests that require audio hardware",
    "slow: slow-running tests",
]
